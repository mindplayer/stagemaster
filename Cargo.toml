[workspace]
members = [
  "apps/engine-demo",
  "crates/stagemaster-dmx",
  "crates/stagemaster-domain",
  "crates/stagemaster-engine",
  "crates/stagemaster-show",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "LicenseRef-Proprietary"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

