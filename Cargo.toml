[workspace]
members = [
  "apps/desktop",
  "apps/engine-demo",
  "crates/stagemaster-dmx",
  "crates/stagemaster-domain",
  "crates/stagemaster-engine",
  "crates/stagemaster-show",
  "crates/stagemaster-project",
  "crates/stagemaster-playback",
  "crates/stagemaster-package",
  "crates/stagemaster-install",
  "crates/stagemaster-install-store",
  "crates/stagemaster-device-link",
  "crates/stagemaster-project-store",
  "crates/stagemaster-spatial",
  "crates/stagemaster-previs",
]
resolver = "3"
exclude = ["apps/esp32-player"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "LicenseRef-Proprietary"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
