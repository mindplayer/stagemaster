[workspace]
members = [
  "apps/desktop",
  "apps/execution-host",
  "crates/stagemaster-execution-client",
  "crates/stagemaster-audio",
  "apps/engine-demo",
  "crates/stagemaster-dmx",
  "crates/stagemaster-output-port",
  "crates/stagemaster-domain",
  "crates/stagemaster-engine",
  "crates/stagemaster-live",
  "crates/stagemaster-live-host",
  "crates/stagemaster-show",
  "crates/stagemaster-project",
  "crates/stagemaster-playback",
  "crates/stagemaster-time",
  "crates/stagemaster-package",
  "crates/stagemaster-install",
  "crates/stagemaster-install-store",
  "crates/stagemaster-nor-store",
  "crates/stagemaster-runtime",
  "crates/stagemaster-runtime-host",
  "crates/stagemaster-transfer",
  "crates/stagemaster-install-worker",
  "crates/stagemaster-device-link",
  "crates/stagemaster-device-auth",
  "crates/stagemaster-device-session",
  "crates/stagemaster-device-channel",
  "crates/stagemaster-device-info",
  "crates/stagemaster-device-host",
  "crates/stagemaster-device-upload",
  "crates/stagemaster-project-store",
  "crates/stagemaster-spatial",
  "crates/stagemaster-previs",
]
resolver = "3"
exclude = ["apps/esp32-player"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "LicenseRef-Proprietary"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
