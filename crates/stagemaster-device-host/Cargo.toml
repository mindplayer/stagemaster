[package]
name = "stagemaster-device-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
bonded-experiment = []

[dependencies]
stagemaster-runtime = { path = "../stagemaster-runtime" }
stagemaster-package = { path = "../stagemaster-package" }
stagemaster-runtime-protocol = { path = "../stagemaster-runtime-protocol" }
getrandom = "=0.3.4"
zeroize = { version = "=1.9.0", default-features = false }
stagemaster-device-auth = { path = "../stagemaster-device-auth", features = ["application"] }
stagemaster-device-session = { path = "../stagemaster-device-session" }
stagemaster-device-channel = { path = "../stagemaster-device-channel" }
btleplug = "=0.13.2"
futures-util = "=0.3.34"
serde = { version = "=1.0.229", features = ["derive"] }
stagemaster-device-link = { path = "../stagemaster-device-link" }
stagemaster-device-info = { path = "../stagemaster-device-info" }
stagemaster-transfer = { path = "../stagemaster-transfer" }
tokio = { version = "=1.53.1", features = ["rt", "sync", "time", "macros"] }
uuid = "=1.26.1"

[dev-dependencies]
stagemaster-install-worker = { path = "../stagemaster-install-worker", features = ["application"] }
stagemaster-playback = { path = "../stagemaster-playback" }
stagemaster-install = { path = "../stagemaster-install" }
stagemaster-install-store = { path = "../stagemaster-install-store" }
stagemaster-project = { path = "../stagemaster-project" }
tempfile = "=3.27.0"
tokio = { version = "=1.53.1", features = ["test-util", "rt-multi-thread", "net"] }
serde_json = "=1.0.151"

[lints]
workspace = true
