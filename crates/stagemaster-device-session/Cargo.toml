[package]
name = "stagemaster-device-session"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
snow = { version = "=0.10.0", default-features = false, features = ["use-curve25519", "use-chacha20poly1305", "use-sha2"] }
subtle = { version = "=2.6.1", default-features = false }
zeroize = { version = "=1.9.0", default-features = false }

[dev-dependencies]
stagemaster-device-link = { path = "../stagemaster-device-link" }
noise-protocol = { version = "=0.2.1", default-features = false }
noise-rust-crypto = { version = "=0.6.2", default-features = false, features = ["use-x25519", "use-chacha20poly1305", "use-sha2"] }

[lints]
workspace = true
