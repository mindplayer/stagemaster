[package]
name = "stagemaster-delivery"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
http = ["dep:reqwest", "dep:tokio"]

[dependencies]
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls"], optional = true }
stagemaster-install = { path = "../stagemaster-install" }
stagemaster-package = { path = "../stagemaster-package" }
tokio = { version = "=1.53.1", features = ["rt", "time", "macros"], optional = true }

[dev-dependencies]
rcgen = { version = "=0.14.10", default-features = false, features = ["crypto", "aws_lc_rs"] }
time = "=0.3.55"
serde_json = "=1.0.151"
stagemaster-project = { path = "../stagemaster-project" }
stagemaster-install-store = { path = "../stagemaster-install-store" }
stagemaster-runtime = { path = "../stagemaster-runtime" }
stagemaster-playback = { path = "../stagemaster-playback" }
tempfile = "=3.27.0"
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "net", "io-util", "sync"] }
tokio-rustls = "=0.26.4"

[lints]
workspace = true
