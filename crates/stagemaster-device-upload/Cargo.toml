[package]
name = "stagemaster-device-upload"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
futures-util = "=0.3.34"
serde = { version = "=1.0.229", features = ["derive"] }
stagemaster-device-host = { path = "../stagemaster-device-host" }
stagemaster-install = { path = "../stagemaster-install" }
stagemaster-package = { path = "../stagemaster-package" }
stagemaster-transfer = { path = "../stagemaster-transfer" }
tokio = { version = "=1.53.1", features = ["rt", "sync", "time", "macros"] }
uuid = { version = "=1.26.1", features = ["v4"] }

[dev-dependencies]
stagemaster-install-store = { path = "../stagemaster-install-store" }
stagemaster-project = { path = "../stagemaster-project" }
serde_json = "=1.0.151"
tempfile = "=3.27.0"
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "test-util"] }

[lints]
workspace = true
