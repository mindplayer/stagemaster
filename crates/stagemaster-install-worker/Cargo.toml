[package]
name = "stagemaster-install-worker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
output = ["dep:stagemaster-output-port"]
application = ["dep:stagemaster-runtime-protocol", "dep:stagemaster-device-auth", "dep:stagemaster-device-session", "dep:stagemaster-device-link"]

[dependencies]
stagemaster-output-port = { path = "../stagemaster-output-port", optional = true }
stagemaster-runtime-protocol = { path = "../stagemaster-runtime-protocol", optional = true }
stagemaster-device-auth = { path = "../stagemaster-device-auth", features = ["application"], optional = true }
stagemaster-device-session = { path = "../stagemaster-device-session", optional = true }
stagemaster-device-link = { path = "../stagemaster-device-link", optional = true }
stagemaster-install = { path = "../stagemaster-install" }
stagemaster-transfer = { path = "../stagemaster-transfer" }
stagemaster-runtime = { path = "../stagemaster-runtime" }
stagemaster-package = { path = "../stagemaster-package" }

[dev-dependencies]
embassy-sync = "=0.8.0"
stagemaster-output-port = { path = "../stagemaster-output-port", features = ["queued-dmx"] }
stagemaster-playback = { path = "../stagemaster-playback" }
stagemaster-install-store = { path = "../stagemaster-install-store" }
stagemaster-project = { path = "../stagemaster-project" }
tempfile = "=3.27.0"
serde_json = "=1.0.151"

[lints]
workspace = true
