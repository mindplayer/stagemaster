[package]
name = "stagemaster-execution-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
stagemaster-live = { path = "../../crates/stagemaster-live" }
stagemaster-live-host = { path = "../../crates/stagemaster-live-host" }
stagemaster-runtime-host = { path = "../../crates/stagemaster-runtime-host" }
stagemaster-runtime = { path = "../../crates/stagemaster-runtime" }
stagemaster-project = { path = "../../crates/stagemaster-project" }
stagemaster-project-store = { path = "../../crates/stagemaster-project-store" }
stagemaster-package = { path = "../../crates/stagemaster-package" }
stagemaster-install = { path = "../../crates/stagemaster-install" }
stagemaster-install-store = { path = "../../crates/stagemaster-install-store" }
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
tokio = { version = "=1.53.1", features = ["net", "sync", "time", "rt-multi-thread", "io-util"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
uuid = { version = "=1.26.1", features = ["v4"] }

[dev-dependencies]
reqwest = { version = "=0.13.5", default-features = false, features = ["json"] }
tempfile = "=3.27.0"

[lints]
workspace = true
