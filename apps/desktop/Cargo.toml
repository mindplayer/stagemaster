[package]
name = "stagemaster-desktop"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
development-device-access = []
internal-acceptance = []

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
stagemaster-execution-client = { path = "../../crates/stagemaster-execution-client" }
stagemaster-audio = { path = "../../crates/stagemaster-audio" }
stagemaster-device-host = { path = "../../crates/stagemaster-device-host" }
stagemaster-device-upload = { path = "../../crates/stagemaster-device-upload" }
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
tokio = { version = "=1.53.1", features = ["net", "sync", "time"] }
uuid = { version = "=1.26.1", features = ["v4"] }
stagemaster-previs = { path = "../../crates/stagemaster-previs" }
stagemaster-playback = { path = "../../crates/stagemaster-playback" }
stagemaster-project = { path = "../../crates/stagemaster-project" }
stagemaster-project-store = { path = "../../crates/stagemaster-project-store" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tauri = { version = "=2.11.6", features = [] }
tauri-plugin-dialog = "=2.7.3"
tempfile = "=3.27.0"

[lints]
workspace = true

[dev-dependencies]
rodio = { version = "=0.22.2", default-features = false }
reqwest = { version = "=0.13.5", default-features = false, features = ["json"] }
