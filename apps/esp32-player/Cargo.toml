[package]
name = "stagemaster-esp32-probe"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "LicenseRef-Proprietary"

[workspace]

[dependencies]
stagemaster-playback = { path = "../../crates/stagemaster-playback" }
stagemaster-device-link = { path = "../../crates/stagemaster-device-link" }
esp-hal = { version = "=1.2.2", features = ["esp32s3", "unstable"] }
esp-radio = { version = "=1.0.0-beta.1", features = ["esp32s3", "ble", "unstable"] }
esp-rtos = { version = "=0.4.0", features = ["esp32s3", "embassy", "esp-radio", "esp-alloc"] }
esp-alloc = "=0.11.0"
esp-println = { version = "=0.18.0", features = ["esp32s3"] }
esp-backtrace = { version = "=0.20.0", features = ["esp32s3", "panic-handler", "println"] }
esp-bootloader-esp-idf = { version = "=0.6.0", features = ["esp32s3"] }
embassy-executor = "=0.10.0"
embassy-time = "=0.5.1"
embassy-futures = "=0.1.2"
static_cell = "=2.1.1"
trouble-host = { version = "=0.8.0", default-features = false, features = ["peripheral", "gatt", "derive", "default-packet-pool"] }

[profile.release]
opt-level = 3
debug = 2
lto = "thin"
codegen-units = 1
overflow-checks = true

[profile.dev]
opt-level = "s"
