[package]
name = "stagemaster-esp32-probe"
version = "0.2.0"
edition = "2024"
rust-version = "1.97"
license = "LicenseRef-Proprietary"

[workspace]

[features]
security-readiness = ["trouble-host/security"]
binding-readiness = ["security-readiness", "worker-readiness", "dep:stagemaster-device-auth"]
binding-local-test = ["binding-readiness"]
runtime-readiness = ["storage-readiness", "dep:stagemaster-runtime", "dep:stagemaster-package"]
storage-readiness = ["dep:esp-storage", "dep:stagemaster-install", "dep:stagemaster-nor-store", "dep:stagemaster-transfer", "esp-bootloader-esp-idf/embedded-storage"]
worker-readiness = ["storage-readiness", "dep:stagemaster-install-worker", "dep:stagemaster-runtime", "dep:embassy-sync", "dep:embedded-storage", "esp-alloc/internal-heap-stats"]
worker-write-test = ["worker-readiness", "dep:stagemaster-package", "dep:sha2"]

[dependencies]
stagemaster-device-auth = { path = "../../crates/stagemaster-device-auth", features = ["persistence"], optional = true }
sha2 = { version = "=0.10.9", default-features = false, optional = true }
stagemaster-install-worker = { path = "../../crates/stagemaster-install-worker", optional = true }
embassy-sync = { version = "=0.8.0", optional = true }
embedded-storage = { version = "=0.3.2", optional = true }
stagemaster-runtime = { path = "../../crates/stagemaster-runtime", optional = true }
stagemaster-package = { path = "../../crates/stagemaster-package", optional = true }
esp-storage = { version = "=0.10.0", features = ["esp32s3"], optional = true }
stagemaster-install = { path = "../../crates/stagemaster-install", optional = true }
stagemaster-nor-store = { path = "../../crates/stagemaster-nor-store", optional = true }
stagemaster-transfer = { path = "../../crates/stagemaster-transfer", optional = true }
stagemaster-playback = { path = "../../crates/stagemaster-playback" }
stagemaster-device-link = { path = "../../crates/stagemaster-device-link" }
stagemaster-device-info = { path = "../../crates/stagemaster-device-info" }
esp-hal = { version = "=1.2.2", features = ["esp32s3", "unstable"] }
esp-radio = { version = "=1.0.0-beta.1", features = ["esp32s3", "ble", "unstable"] }
esp-rtos = { version = "=0.4.0", features = ["esp32s3", "embassy", "esp-radio", "esp-alloc"] }
esp-alloc = "=0.11.0"
esp-println = { version = "=0.18.0", features = ["esp32s3"] }
esp-backtrace = { version = "=0.20.0", features = ["esp32s3", "panic-handler", "println"] }
esp-bootloader-esp-idf = { version = "=0.6.0", features = ["esp32s3"] }
embassy-executor = "=0.10.0"
embassy-time = "=0.5.1"
embassy-futures = "=0.1.2"
static_cell = "=2.1.1"
trouble-host = { version = "=0.8.0", default-features = false, features = ["peripheral", "gatt", "derive", "default-packet-pool"] }

[profile.release]
opt-level = 3
debug = 2
lto = "thin"
codegen-units = 1
overflow-checks = true

[profile.dev]
opt-level = "s"
